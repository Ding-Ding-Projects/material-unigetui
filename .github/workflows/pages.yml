name: Deploy Day Teet Hui

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'script/build-site.mjs'
      - 'app/test/fixtures/feature-completeness/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

# Never cancel a deployment in flight. A cancelled publish can leave the site
# half-updated, and unlike a validation run there is no verdict to re-derive.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Regenerate the site from the inventory
        # Generated here rather than trusted from the commit, so a stale
        # committed page cannot claim a contract status the inventory contradicts.
        run: node script/build-site.mjs

      - name: Fail if the committed site is out of date
        run: |
          if ! git diff --quiet -- site/; then
            echo "::error::site/ is stale — run 'node script/build-site.mjs' and commit the result"
            git --no-pager diff --stat -- site/
            exit 1
          fi

      - name: Refuse any off-origin asset
        # A CDN link would break the offline promise the footer makes, and would
        # do it silently.
        run: |
          if grep -nE '(src|href)="https?://' site/index.html | grep -v 'og:image'; then
            echo "::error::site/index.html references an off-origin asset"
            exit 1
          fi
          echo "all assets are local"

      - uses: actions/configure-pages@v6

      - name: Assemble publish directory
        run: |
          mkdir -p _site
          cp -r site/* _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
