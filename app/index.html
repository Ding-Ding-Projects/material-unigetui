<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Deliberately strict and offline-only. The design referenced Google Fonts
      over the network; a desktop application has to work with the network
      unplugged, so every asset is bundled and no remote origin is allowed here.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;"
    />
    <title>Material UniGetUI</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="./renderer.js"></script>
  </body>
</html>
