name: Deploy Day Teet Hui

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'script/build-site.mjs'
      - 'app/test/fixtures/feature-completeness/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

# Cancel in progress, deliberately — and unlike the release workflow, which has
# no concurrency group at all.
#
# A Pages deploy is idempotent: the newest publish is a superset of the one it
# replaces, so cancelling a stale deploy loses nothing. A release is not — a
# cancelled publish can strand a tag with no artifact attached, which is why
# these two workflows are configured differently on purpose.
#
# Observed here first: with cancel-in-progress false, GitHub kept one pending
# run per group and cancelled the rest, so the site sat several deploys behind
# while runs queued.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Regenerate the site from the inventory
        # Generated here rather than trusted from the commit, so a stale
        # committed page cannot claim a contract status the inventory contradicts.
        run: node script/build-site.mjs

      - name: Fail if the committed site is out of date
        run: |
          if ! git diff --quiet -- site/; then
            echo "::error::site/ is stale — run 'node script/build-site.mjs' and commit the result"
            git --no-pager diff --stat -- site/
            exit 1
          fi

      - name: Refuse any off-origin asset
        # A CDN reference would break the offline promise the footer makes, and
        # would do it silently.
        #
        # Assets only — things the page LOADS. An ordinary <a href> to another
        # site is navigation the visitor chose, not an asset, and an earlier
        # version of this check failed the build over the link to this very
        # repository.
        run: |
          if grep -nE '(<link[^>]+href|src)="https?://' site/index.html; then
            echo "::error::site/index.html loads an off-origin asset"
            exit 1
          fi
          echo "all loaded assets are local"

      - uses: actions/configure-pages@v6

      - name: Assemble publish directory
        run: |
          mkdir -p _site
          cp -r site/* _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
